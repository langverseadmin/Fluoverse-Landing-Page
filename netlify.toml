[build]
  base = "/"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/image"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect www to non-www (or vice versa - adjust as needed)
[[redirects]]
  from = "https://www.fluoverse.com/*"
  to = "https://fluoverse.com/:splat"
  status = 301
  force = true