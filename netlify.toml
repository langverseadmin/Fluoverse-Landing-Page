[build]
  base = "/"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/.well-known/apple-app-site-association"
  to = "/.well-known/apple-app-site-association"
  status = 200

[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/.well-known/assetlinks.json"
  status = 200

[[redirects]]
  from = "/r"
  to = "https://fluoverseapp.netlify.app"
  status = 302
  force = true

[[redirects]]
  from = "/r/*"
  to = "https://fluoverseapp.netlify.app/:splat"
  status = 302
  force = true

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/image"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# Redirect www to non-www (or vice versa - adjust as needed)
[[redirects]]
  from = "https://www.fluoverse.com/*"
  to = "https://fluoverse.com/:splat"
  status = 301
  force = true